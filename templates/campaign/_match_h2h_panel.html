<!-- Full Head-to-Head History Modal -->
<div id="h2h-full-history-modal" role="dialog" aria-modal="true">
  <div class="h2h-full-card">
    <div class="h2h-full-header">
      <div>
        <h3 id="h2h-full-title" style="margin:0; font-size:1.2em; color:#38bdf8; font-weight:800;">📜 TOÀN BỘ LỊCH SỬ ĐỐI ĐẦU</h3>
        <div id="h2h-full-subtitle" style="font-size:0.82em; color:#94a3b8; margin-top:3px;">Chi tiết tất cả các lần chạm trán trong chiến dịch</div>
      </div>
      <button type="button" onclick="closeFullH2HModal()" style="background:transparent; border:1px solid rgba(148,163,184,0.3); color:#94a3b8; width:34px; height:34px; border-radius:8px; font-size:1.2em; cursor:pointer;">&times;</button>

    <div id="h2h-full-hero" class="h2h-full-hero"></div>

    <div class="h2h-filter-bar">
      <div class="h2h-filter-controls">
        <select id="h2h-filter-year" class="h2h-select" onchange="renderFullH2HList()">
          <option value="">Tất cả mùa giải</option>
        </select>
        <select id="h2h-filter-scope" class="h2h-select" onchange="renderFullH2HList()">
          <option value="all">Tất cả giải đấu</option>
          <option value="intl">🌐 Quốc tế (Major/Masters/EWC/Champ)</option>
          <option value="reg">🏠 Quốc nội (Qualifiers/Kickoff/Stage)</option>
        </select>
        <select id="h2h-filter-winner" class="h2h-select" onchange="renderFullH2HList()">
          <option value="all">Mọi kết quả</option>
          <option value="a">Team A thắng</option>
          <option value="b">Team B thắng</option>
        </select>
        <select id="h2h-filter-order" class="h2h-select" onchange="renderFullH2HList()">
          <option value="desc">Mới nhất trước</option>
          <option value="asc">Cũ nhất trước</option>
        </select>
      </div>

<script>
(function () {
  if (window.__h2hModalHookInstalled) return;
  window.__h2hModalHookInstalled = true;

  const CAMPAIGN_ID = {{ campaign.id }};
  const DEFAULT_YEAR = {{ campaign.current_year or 2027 }};
  const DEFAULT_STAGE = {{ (campaign.current_stage or '')|tojson }};

  const MODAL_IDS = [
    'ko-manual-modal',
    'oq-manual-modal',
    'stage1-manual-modal',
    'stage2-manual-modal',
    'master-manual-modal',
    'champion-manual-modal',
    'major-manual-modal',
    'ewc-manual-modal',
    'manualScoreModal',
  ];

  const OPENER_NAMES = [
    'openKoManualModal',
    'openOqManualModal',
    'openStage1ManualModal',
    'openStage2ManualModal',
    'openMasterManualModal',
    'openChampionManualModal',
    'openMajorManualModal',
    'openEWCManualModal',
  ];

  let reqToken = 0;
  let activeAbortCtrl = null;
  let currentH2HQuery = null;
  let fullH2HDataCache = null;

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function findVisibleMatchBackdrop() {
    for (let i = 0; i < MODAL_IDS.length; i++) {
      const el = document.getElementById(MODAL_IDS[i]);
      if (!el) continue;
      const disp = el.style.display || window.getComputedStyle(el).display;
      if (disp && disp !== 'none') {
        return el;
      }
    }
    return null;
  }

  function detectStageContext() {
    const pathMatch = window.location.pathname.match(/^\/campaign\/(\d+)\/stage\/([a-z0-9_]+)/i);
    const params = new URLSearchParams(window.location.search);
    const stageKey = pathMatch ? pathMatch[2] : DEFAULT_STAGE;
    const yearVal = params.get('year') || String(DEFAULT_YEAR);
    const regionVal =
      params.get('region') ||
      window.activeKickoffRegion ||
      window.activeStage1Region ||
      window.activeStage2Region ||
      window.currentRegion ||
      '';
    return {
      campaignId: pathMatch ? Number(pathMatch[1]) : CAMPAIGN_ID,
      stageKey: stageKey,
      year: yearVal,
      regionSlug: regionVal,
    };
  }

  window.openH2HReplayStage = function (stageKey, year, regionSlug) {
    if (typeof window.openTournamentReplayModal === 'function') {
      window.openTournamentReplayModal(CAMPAIGN_ID, stageKey, year, regionSlug || null);
    }
  };

  window.closeFullH2HModal = function () {
    const modal = document.getElementById('h2h-full-history-modal');
    if (modal) modal.style.display = 'none';
  };

  window.openFullH2HModal = async function () {
    if (!currentH2HQuery) return;
    const modal = document.getElementById('h2h-full-history-modal');
    const body = document.getElementById('h2h-full-body');
    const hero = document.getElementById('h2h-full-hero');
    if (!modal || !body || !hero) return;

    modal.style.display = 'flex';
    body.innerHTML = '<div class="h2h-empty-box">⏳ Đang tải toàn bộ lịch sử đối đầu...</div>';

    if (!fullH2HDataCache) {
      const qs = new URLSearchParams(currentH2HQuery.params);
      qs.set('limit', '0');
      qs.set('all', '1');
      try {
        const resp = await fetch('/api/campaign/' + currentH2HQuery.campaignId + '/h2h?' + qs.toString());
        const data = await resp.json();
        if (!resp.ok || !data.success) {
          throw new Error(data.error || 'Không thể tải lịch sử đầy đủ');
        }
        fullH2HDataCache = data;
      } catch (err) {
        body.innerHTML = '<div class="h2h-empty-box" style="color:#fb7185;">⚠️ ' + esc(err.message || 'Lỗi tải dữ liệu') + '</div>';
        return;
      }
    }

    populateFullH2HModal(fullH2HDataCache);
  };

  function populateFullH2HModal(data) {
    const sum = data.summary || {};
    const ta = data.team_a || {};
    const tb = data.team_b || {};
    const total = Number(sum.total_matches || 0);
    const winsA = Number(sum.team_a_wins || 0);
    const winsB = Number(sum.team_b_wins || 0);
    const mapsA = Number(sum.team_a_maps || 0);
    const mapsB = Number(sum.team_b_maps || 0);
    const roundsA = Number(sum.team_a_rounds || 0);
    const roundsB = Number(sum.team_b_rounds || 0);
    const roundDiff = roundsA - roundsB;
    const roundDiffStr = roundDiff > 0 ? ('+' + roundDiff) : String(roundDiff);
    const pctA = total > 0 ? Math.max(4, Math.min(96, (winsA / total) * 100)) : 50;

    document.getElementById('h2h-full-title').textContent =
      '📜 FULL LỊCH SỬ ĐỐI ĐẦU: ' + (ta.short_code || '') + ' vs ' + (tb.short_code || '');
    document.getElementById('h2h-full-subtitle').textContent =
      (ta.name || '') + ' vs ' + (tb.name || '') + ' · Tổng cộng ' + total + ' trận đấu đã ghi nhận';

    const logoA = ta.logo_url ? '<img class="h2h-team-logo" style="width:30px;height:30px;" src="' + esc(ta.logo_url) + '" alt="' + esc(ta.short_code) + '">' : '';
    const logoB = tb.logo_url ? '<img class="h2h-team-logo" style="width:30px;height:30px;" src="' + esc(tb.logo_url) + '" alt="' + esc(tb.short_code) + '">' : '';
    const aClass = winsA > winsB ? 'h2h-win-num' : (winsA < winsB ? 'h2h-loss-num' : '');
    const bClass = winsB > winsA ? 'h2h-win-num' : (winsB < winsA ? 'h2h-loss-num' : '');

    document.getElementById('h2h-full-hero').innerHTML =
      '<div class="h2h-teams-row">' +
        '<div class="h2h-team-col">' +
          '<div class="h2h-team-head">' + logoA +
            '<div><div class="h2h-team-code" style="font-size:1.12em;">' + esc(ta.name) + ' (' + esc(ta.short_code) + ')</div>' +
            '<div class="h2h-team-sub">' + esc(ta.region) + '</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="h2h-series-center">' +
          '<div class="h2h-series-score" style="font-size:1.85em;"><span class="' + aClass + '">' + winsA + '</span> - <span class="' + bClass + '">' + winsB + '</span></div>' +
          '<div class="h2h-maps-diff">Tỉ lệ thắng ' + esc(ta.short_code) + ': ' + Number(sum.team_a_winrate || 0).toFixed(1) + '%</div>' +
        '</div>' +
        '<div class="h2h-team-col right">' +
          '<div class="h2h-team-head">' + logoB +
            '<div><div class="h2h-team-code" style="font-size:1.12em;">' + esc(tb.name) + ' (' + esc(tb.short_code) + ')</div>' +
            '<div class="h2h-team-sub">' + esc(tb.region) + '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="h2h-bar-track"><div class="h2h-bar-fill-a" style="width:' + pctA.toFixed(1) + '%;"></div></div>' +
      '<div class="h2h-full-stats-grid">' +
        '<div class="h2h-stat-tile"><div class="h2h-stat-label">Hiệu số Map</div><div class="h2h-stat-val">' + mapsA + ' - ' + mapsB + '</div></div>' +
        '<div class="h2h-stat-tile"><div class="h2h-stat-label">Tổng Round (' + esc(ta.short_code) + ')</div><div class="h2h-stat-val">' + roundsA + ' - ' + roundsB + ' (' + roundDiffStr + ')</div></div>' +
        '<div class="h2h-stat-tile"><div class="h2h-stat-label">🌐 Quốc tế</div><div class="h2h-stat-val">' + Number(sum.international_a_wins || 0) + ' - ' + Number(sum.international_b_wins || 0) + '</div></div>' +
        '<div class="h2h-stat-tile"><div class="h2h-stat-label">🏠 Quốc nội</div><div class="h2h-stat-val">' + Number(sum.regional_a_wins || 0) + ' - ' + Number(sum.regional_b_wins || 0) + '</div></div>' +
        '<div class="h2h-stat-tile"><div class="h2h-stat-label">Chuỗi hiện tại</div><div class="h2h-stat-val" style="color:#fbbf24;font-size:0.92em;">🔥 ' + esc(sum.streak_text) + '</div></div>' +
      '</div>';

    const yrSel = document.getElementById('h2h-filter-year');
    const winSel = document.getElementById('h2h-filter-winner');
    yrSel.innerHTML = '<option value="">Tất cả mùa giải (' + total + ')</option>' +
      (sum.available_years || []).map(y => '<option value="' + Number(y) + '">Năm ' + Number(y) + '</option>').join('');
    document.getElementById('h2h-filter-scope').value = 'all';
    winSel.innerHTML =
      '<option value="all">Mọi kết quả</option>' +
      '<option value="a">🏆 ' + esc(ta.short_code) + ' thắng</option>' +
      '<option value="b">🏆 ' + esc(tb.short_code) + ' thắng</option>';
    document.getElementById('h2h-filter-order').value = 'desc';

    window.renderFullH2HList();
  }

  window.renderFullH2HList = function () {
    const data = fullH2HDataCache;
    const body = document.getElementById('h2h-full-body');
    const subsetEl = document.getElementById('h2h-full-subset-summary');
    if (!data || !body) return;

    const ta = data.team_a || {};
    const tb = data.team_b || {};
    const fYear = document.getElementById('h2h-filter-year').value;
    const fScope = document.getElementById('h2h-filter-scope').value;
    const fWinner = document.getElementById('h2h-filter-winner').value;
    const fOrder = document.getElementById('h2h-filter-order').value;

    let rows = (data.matches || []).filter(m => {
      if (fYear && String(m.year) !== String(fYear)) return false;
      if (fScope === 'intl' && !m.is_international) return false;
      if (fScope === 'reg' && m.is_international) return false;
      const aWin = !!m.won_by_a;
      if (fWinner === 'a' && !aWin) return false;
      if (fWinner === 'b' && aWin) return false;
      return true;
    });

    if (fOrder === 'asc') {
      rows = rows.slice().reverse();
    }

    let subWinsA = 0, subWinsB = 0, subMapsA = 0, subMapsB = 0;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].won_by_a) subWinsA++;
      else if (rows[i].score_b > rows[i].score_a || rows[i].winner_id === tb.id) subWinsB++;
      subMapsA += Number(rows[i].score_a || 0);
      subMapsB += Number(rows[i].score_b || 0);
    }
    if (subsetEl) {
      subsetEl.textContent =
        'Đang hiện ' + rows.length + ' trận · Tỉ số nhánh lọc: ' +
        (ta.short_code || 'A') + ' ' + subWinsA + ' - ' + subWinsB + ' ' + (tb.short_code || 'B') +
        ' (Map ' + subMapsA + '-' + subMapsB + ')';
    }

    if (rows.length === 0) {
      body.innerHTML = '<div class="h2h-empty-box">Không có trận đấu nào khớp với bộ lọc hiện tại.</div>';
      return;
    }

    const totalAll = rows.length;
    body.innerHTML = rows.map((m, idx) => {
      const seqNum = fOrder === 'asc' ? (idx + 1) : (totalAll - idx);
      const aWin = !!m.won_by_a;
      const bWin = !aWin && (m.score_b > m.score_a || m.winner_id === tb.id);
      const regArg = m.region_slug ? ("'" + esc(m.region_slug) + "'") : 'null';
      const regTag = m.region_slug ? (' · ' + String(m.region_slug).toUpperCase()) : '';
      const scopeHtml = m.is_international
        ? '<span class="h2h-scope-pill intl">🌐 Quốc tế</span>'
        : '<span class="h2h-scope-pill reg">🏠 Quốc nội</span>';
      const rdDiff = Number(m.round_diff || 0);
      const hasRounds = Number(m.rounds_a || 0) + Number(m.rounds_b || 0) > 0;
      const rdHtml = hasRounds
        ? '<span style="font-size:0.78em;color:#94a3b8;">Round: ' + Number(m.rounds_a) + '-' + Number(m.rounds_b) +
          ' (<strong style="color:' + (rdDiff >= 0 ? '#34d399' : '#fb7185') + ';">' + (rdDiff > 0 ? '+' + rdDiff : rdDiff) + '</strong>)</span>'
        : '';

      const mapsList = m.maps_list || [];
      let mapsHtml = '';
      if (mapsList.length > 0) {
        mapsHtml = '<div class="h2h-maps-pills">' + mapsList.map(mp => {
          const cls = mp.winner_side === 'a' ? 'win-a' : (mp.winner_side === 'b' ? 'win-b' : '');
          return '<span class="h2h-map-chip ' + cls + '">' + esc(mp.map_name) + ' ' + Number(mp.score_a) + '-' + Number(mp.score_b) + '</span>';
        }).join('') + '</div>';
      } else if (m.maps_summary) {
        mapsHtml = '<div class="h2h-item-maps">Maps: ' + esc(m.maps_summary) + '</div>';
      }

      return (
        '<div class="h2h-full-row">' +
          '<div class="h2h-full-row-top">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<span style="color:#64748b;font-weight:800;">#' + seqNum + '</span>' +
              '<button type="button" class="h2h-stage-link" style="max-width:none;" onclick="openH2HReplayStage(\'' + esc(m.stage_key) + '\', ' + Number(m.year) + ', ' + regArg + ')" title="Mở xem lại giải đấu này">' +
                '📜 ' + Number(m.year) + ' · ' + esc(m.stage_name) + esc(regTag) +
              '</button>' +
              scopeHtml +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:10px;color:#94a3b8;">' +
              '<span>' + esc(m.round_name) + '</span>' +
              rdHtml +
            '</div>' +
          '</div>' +
          '<div class="h2h-item-score-row" style="font-size:1em;">' +
            '<div class="h2h-item-side ' + (aWin ? 'winner' : '') + '">' + esc(ta.name) + ' (' + esc(ta.short_code) + ')</div>' +
            '<div class="h2h-item-score-box" style="padding:3px 12px;font-size:1.05em;">' + Number(m.score_a) + ' - ' + Number(m.score_b) + '</div>' +
            '<div class="h2h-item-side right ' + (bWin ? 'winner' : '') + '">' + esc(tb.name) + ' (' + esc(tb.short_code) + ')</div>' +
          '</div>' +
          mapsHtml +
        '</div>'
      );
    }).join('');
  };

  function renderLoading(teamACode, teamAName, teamBCode, teamBName) {
    const badge = document.getElementById('h2h-total-badge');
    const body = document.getElementById('h2h-panel-body');
    if (badge) badge.textContent = '...';
    if (body) {
      body.innerHTML =
        '<div class="h2h-scoreboard" style="margin-bottom:10px;">' +
          '<div class="h2h-teams-row">' +
            '<div class="h2h-team-col"><span class="h2h-team-code">' + esc(teamACode || 'TEAM A') + '</span><span class="h2h-team-sub">' + esc(teamAName || '') + '</span></div>' +
            '<div class="h2h-series-center"><div class="h2h-series-score">VS</div></div>' +
            '<div class="h2h-team-col right"><span class="h2h-team-code">' + esc(teamBCode || 'TEAM B') + '</span><span class="h2h-team-sub">' + esc(teamBName || '') + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="h2h-empty-box">⏳ Đang tra cứu lịch sử đối đầu...</div>';
    }
  }

  function renderH2HData(data) {
    const badge = document.getElementById('h2h-total-badge');
    const body = document.getElementById('h2h-panel-body');
    if (!body) return;

    const sum = data.summary || {};
    const ta = data.team_a || {};
    const tb = data.team_b || {};
    const total = Number(sum.total_matches || 0);
    const winsA = Number(sum.team_a_wins || 0);
    const winsB = Number(sum.team_b_wins || 0);
    const mapsA = Number(sum.team_a_maps || 0);
    const mapsB = Number(sum.team_b_maps || 0);
    const pctA = total > 0 ? Math.max(4, Math.min(96, (winsA / total) * 100)) : 50;

    if (badge) badge.textContent = total + ' trận';

    const logoA = ta.logo_url
      ? '<img class="h2h-team-logo" src="' + esc(ta.logo_url) + '" alt="' + esc(ta.short_code) + '">'
      : '';
    const logoB = tb.logo_url
      ? '<img class="h2h-team-logo" src="' + esc(tb.logo_url) + '" alt="' + esc(tb.short_code) + '">'
      : '';

    const aClass = winsA > winsB ? 'h2h-win-num' : (winsA < winsB ? 'h2h-loss-num' : '');
    const bClass = winsB > winsA ? 'h2h-win-num' : (winsB < winsA ? 'h2h-loss-num' : '');

    let formHtml = '';
    const formArr = sum.recent_form || [];
    if (formArr.length > 0) {
      formHtml = '<div class="h2h-form-dots" title="5 trận gần nhất theo góc nhìn ' + esc(ta.short_code) + '">' +
        '<span style="color:#64748b;margin-right:2px;">' + esc(ta.short_code) + ':</span>' +
        formArr.map(f => '<span class="h2h-form-pill ' + esc(f) + '">' + esc(f) + '</span>').join('') +
        '</div>';
    }

    let html =
      '<div class="h2h-scoreboard">' +
        '<div class="h2h-teams-row">' +
          '<div class="h2h-team-col">' +
            '<div class="h2h-team-head">' + logoA + '<span class="h2h-team-code">' + esc(ta.short_code) + '</span></div>' +
            '<span class="h2h-team-sub">' + esc(ta.name) + '</span>' +
          '</div>' +
          '<div class="h2h-series-center">' +
            '<div class="h2h-series-score"><span class="' + aClass + '">' + winsA + '</span> - <span class="' + bClass + '">' + winsB + '</span></div>' +
            '<div class="h2h-maps-diff">Map: ' + mapsA + ' - ' + mapsB + '</div>' +
          '</div>' +
          '<div class="h2h-team-col right">' +
            '<div class="h2h-team-head">' + logoB + '<span class="h2h-team-code">' + esc(tb.short_code) + '</span></div>' +
            '<span class="h2h-team-sub">' + esc(tb.name) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="h2h-bar-track">' +
          '<div class="h2h-bar-fill-a" style="width:' + pctA.toFixed(1) + '%;"></div>' +
        '</div>' +
        (total > 0
          ? '<div class="h2h-meta-row">' +
              '<span class="h2h-streak-pill">🔥 ' + esc(sum.streak_text) + '</span>' +
              formHtml +
            '</div>'
          : '') +
      '</div>';

    const matches = data.matches || [];
    if (matches.length === 0) {
      html +=
        '<div class="h2h-empty-box" style="margin-top:10px;">' +
          '🤝 <strong>Chưa từng đối đầu</strong><br>' +
          esc(ta.short_code) + ' và ' + esc(tb.short_code) + ' chưa chạm trán ở trận đấu hoàn tất nào trước đây trong chiến dịch này.' +
        '</div>';
    } else {
      html += '<div style="font-size:0.76em;font-weight:700;color:#94a3b8;margin:10px 0 6px;letter-spacing:0.3px;">LỊCH SỬ CHẠM TRÁN GẦN NHẤT (' + matches.length + (total > matches.length ? '/' + total : '') + ')</div>';
      html += '<div class="h2h-list">';
      for (let i = 0; i < matches.length; i++) {
        const m = matches[i];
        const aWin = !!m.won_by_a;
        const bWin = !aWin && (m.score_b > m.score_a || m.winner_id === tb.id);
        const regArg = m.region_slug ? ("'" + esc(m.region_slug) + "'") : 'null';
        const regTag = m.region_slug ? (' · ' + String(m.region_slug).toUpperCase()) : '';
        html +=
          '<div class="h2h-match-item">' +
            '<div class="h2h-item-top">' +
              '<button type="button" class="h2h-stage-link" onclick="openH2HReplayStage(\'' + esc(m.stage_key) + '\', ' + Number(m.year) + ', ' + regArg + ')" title="Xem lại giải đấu">' +
                '📜 ' + Number(m.year) + ' · ' + esc(m.stage_name) + esc(regTag) +
              '</button>' +
              '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;">' + esc(m.round_name) + '</span>' +
            '</div>' +
            '<div class="h2h-item-score-row">' +
              '<div class="h2h-item-side ' + (aWin ? 'winner' : '') + '">' + esc(ta.short_code) + '</div>' +
              '<div class="h2h-item-score-box">' + Number(m.score_a) + ' - ' + Number(m.score_b) + '</div>' +
              '<div class="h2h-item-side right ' + (bWin ? 'winner' : '') + '">' + esc(tb.short_code) + '</div>' +
            '</div>' +
            (m.maps_summary ? '<div class="h2h-item-maps">Maps: ' + esc(m.maps_summary) + '</div>' : '') +
          '</div>';
      }
      html += '</div>';
      html +=
        '<button type="button" class="h2h-full-btn" onclick="openFullH2HModal()">' +
          '🔍 Xem Full Lịch Sử &amp; Chi Tiết (' + total + ' trận) →' +
        '</button>';
    }

    body.innerHTML = html;
  }

  async function showMatchH2H(matchId, teamAId, teamACode, teamAName, teamBId, teamBCode, teamBName) {
    const panel = document.getElementById('match-h2h-side-panel');
    if (!panel) return;

    fullH2HDataCache = null;

    const backdrop = findVisibleMatchBackdrop();
    if (!teamAId || !teamBId || String(teamAId) === String(teamBId) || !backdrop) {
      panel.style.display = 'none';
      currentH2HQuery = null;
      return;
    }

    backdrop.style.flexWrap = 'wrap';
    backdrop.style.gap = '16px';
    backdrop.style.padding = '16px';
    backdrop.style.overflowY = 'auto';
    backdrop.style.alignContent = 'center';
    backdrop.appendChild(panel);
    panel.style.display = 'flex';

    renderLoading(teamACode, teamAName, teamBCode, teamBName);

    if (activeAbortCtrl) {
      try { activeAbortCtrl.abort(); } catch (_) {}
    }
    activeAbortCtrl = new AbortController();
    const myToken = ++reqToken;

    const ctx = detectStageContext();
    const params = {
      team_a_id: String(teamAId),
      team_b_id: String(teamBId),
      limit: '15',
    };
    if (matchId) params.exclude_match_key = String(matchId);
    if (ctx.year) params.year = String(ctx.year);
    if (ctx.stageKey) params.stage_key = String(ctx.stageKey);
    if (ctx.regionSlug) params.region_slug = String(ctx.regionSlug);

    currentH2HQuery = { campaignId: ctx.campaignId, params: params };

    const qs = new URLSearchParams(params);
    try {
      const resp = await fetch('/api/campaign/' + ctx.campaignId + '/h2h?' + qs.toString(), {
        signal: activeAbortCtrl.signal,
      });
      const data = await resp.json();
      if (myToken !== reqToken) return;
      if (!resp.ok || !data.success) {
        throw new Error(data.error || 'Không thể tải dữ liệu đối đầu');
      }
      if (data.is_full_history) {
        fullH2HDataCache = data;
      }
      renderH2HData(data);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (myToken !== reqToken) return;
      const body = document.getElementById('h2h-panel-body');
      if (body) {
        body.innerHTML = '<div class="h2h-empty-box" style="color:#fb7185;">⚠️ ' + esc(err.message || 'Lỗi tải H2H') + '</div>';
      }
    }
  }

  function installModalHooks() {
    for (let i = 0; i < OPENER_NAMES.length; i++) {
      const fnName = OPENER_NAMES[i];
      const origFn = window[fnName];
      if (typeof origFn !== 'function' || origFn.__h2hWrapped) continue;

      const wrapped = function (matchId, matchLabel, teamAId, teamACode, teamAName, teamBId, teamBCode, teamBName) {
        const res = origFn.apply(this, arguments);
        try {
          showMatchH2H(matchId, teamAId, teamACode, teamAName, teamBId, teamBCode, teamBName);
        } catch (err) {
          console.error('H2H panel hook error:', err);
        }
        return res;
      };
      wrapped.__h2hWrapped = true;
      window[fnName] = wrapped;
    }
  }

  // Close Full H2H modal when clicking backdrop
  const fullModalEl = document.getElementById('h2h-full-history-modal');
  if (fullModalEl) {
    fullModalEl.addEventListener('click', function (ev) {
      if (ev.target === fullModalEl) {
        window.closeFullH2HModal();
      }
    });
  }

  installModalHooks();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', installModalHooks);
  }
})();
</script>

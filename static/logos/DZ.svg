<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagonal Shield -->
  <polygon points="60,6 108,24 108,82 60,114 12,82 12,24" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="4" filter="url(#glow)" />
  <polygon points="60,14 100,29 100,77 60,105 20,77 20,29" fill="#1e1b4b" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Center Text -->
  <text x="60" y="68" font-family="'Segoe UI', 'Montserrat', Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    DZ
  </text>
</svg>